<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schedule coming soon · Endeavor Frontier Tech Week</title>
<meta name="description" content="Endeavor Frontier Tech Week 2027. June 16–18, Boulder, Colorado. Invitation only. Hosted by Endeavor Colorado and Caruso Ventures.">
<meta property="og:title" content="Endeavor Frontier Tech Week 2027">
<meta property="og:description" content="June 16–18, Boulder, Colorado. Invitation only. Invitations open November 1, 2026.">
<meta property="og:image" content="hero.jpg">
<meta name="theme-color" content="#01000F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: poster hero on the illustrated sunset, then alternating grounds (cream → light teal → white → dark teal → cream → image → black).
   Square corners everywhere, 1px borders, no accent bars: card = picture, hairline, name, small-caps meta (the DTW partner-card anatomy).
   Palette: cream ground, Endeavor Black type, Teal for buttons only, peach for the year/day labels/rules, Dark Teal for numerals, eyebrows, the mid-page band.
   Type: Oswald condensed caps (Founders Grotesk X-Condensed stand-in) for display; Inter for reading. */
:root{
  --black:#01000F; --white:#FFFFFF; --teal:#09E1CD; --dteal:#026771; --lteal:#DCFBFA; --peach:#F4B693; --cream:#FBF7F2;
  --ink:var(--black); --ink-2:rgba(1,0,15,.72); --ink-3:rgba(1,0,15,.5); --rule:rgba(1,0,15,.14);
  --display:'Oswald','Liberation Sans Narrow',Impact,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --max:1240px; --gutter:clamp(16px,4.5vw,64px);
  --hero:url(hero.jpg); --close:none;
  --card:#FFFFFF; --header:rgba(251,247,242,.94); --sec-white:#FFFFFF; --sec-lteal:#DCFBFA; --sec-dteal:#026771; --ph1:#F7DCCB; --ph2:#DCFBFA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#01000F;--card:#0B0B22;--header:rgba(1,0,15,.92);--sec-white:#07071A;--sec-lteal:#081C22;--sec-dteal:#03474F;--ink:#FFFFFF;--ink-2:rgba(255,255,255,.74);--ink-3:rgba(255,255,255,.52);--rule:rgba(255,255,255,.16);--peach:#F4B693;--ph1:#2A1F1A;--ph2:#0B2A2E;color-scheme:dark}}
:root[data-theme="dark"]{--cream:#01000F;--card:#0B0B22;--header:rgba(1,0,15,.92);--sec-white:#07071A;--sec-lteal:#081C22;--sec-dteal:#03474F;--ink:#FFFFFF;--ink-2:rgba(255,255,255,.74);--ink-3:rgba(255,255,255,.52);--rule:rgba(255,255,255,.16);--peach:#F4B693;--ph1:#2A1F1A;--ph2:#0B2A2E;color-scheme:dark}
:root[data-theme="dark"] .eyebrow,:root[data-theme="dark"] .fr .body .meta,:root[data-theme="dark"] .day li time,:root[data-theme="dark"] .tier .top h3,:root[data-theme="dark"] .frow .n,:root[data-theme="dark"] .seg .price,:root[data-theme="dark"] .gcard .fact,:root[data-theme="dark"] .proof .big,:root[data-theme="dark"] .note{color:var(--teal)}
:root[data-theme="dark"] .note{border-color:var(--teal);background:var(--card)}
:root[data-theme="dark"] .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
:root[data-theme="dark"] .format{border-top-color:var(--teal)}
:root[data-theme="dark"] .fr:hover,:root[data-theme="dark"] .fr:focus-visible{border-color:var(--teal)}
:root[data-theme="dark"] .pc .mark.b-jpm,:root[data-theme="dark"] .pc .mark.b-goog{background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eyebrow,:root:not([data-theme="light"]) .fr .body .meta,:root:not([data-theme="light"]) .day li time,:root:not([data-theme="light"]) .tier .top h3,:root:not([data-theme="light"]) .frow .n,:root:not([data-theme="light"]) .seg .price,:root:not([data-theme="light"]) .gcard .fact,:root:not([data-theme="light"]) .proof .big,:root:not([data-theme="light"]) .note{color:var(--teal)}
:root:not([data-theme="light"]) .note{border-color:var(--teal);background:var(--card)}
:root:not([data-theme="light"]) .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
:root:not([data-theme="light"]) .format{border-top-color:var(--teal)}
:root:not([data-theme="light"]) .pc .mark.b-jpm,:root:not([data-theme="light"]) .pc .mark.b-goog{background:#fff}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--dteal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--gutter)}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dteal);font-weight:500}
.eyebrow.peach{color:var(--peach)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.05;font-family:var(--body)}
h2{font-size:clamp(30px,4.4vw,56px);font-weight:700}
h3{font-size:clamp(18px,2vw,22px);font-weight:600;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.lede{font-size:clamp(18px,1.6vw,22px);color:var(--ink-2);max-width:58ch;line-height:1.5}
.small{font-size:14px;color:var(--ink-3)}
.stack{display:grid;gap:16px}
.num{font-family:var(--display);font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:.9}
.meta{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 24px;border-radius:0;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .18s,background .18s,border-color .18s;font-family:var(--body)}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--teal);color:var(--black)}
.btn-primary:hover{background:#2BEBDA}
.btn-ghost{border-color:rgba(1,0,15,.35);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--black)}
.btn-ghost.onhero{border-color:rgba(255,255,255,.6);color:#fff}
.btn-ghost.onhero:hover{border-color:#fff}
.btn .arrow{font-family:var(--display);font-size:18px;line-height:1}

/* header */
.site-header{position:fixed;left:0;right:0;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .25s,color .25s,box-shadow .25s;color:#fff}
.site-header.solid{background:var(--header);backdrop-filter:blur(12px);color:var(--ink);box-shadow:0 1px 0 var(--rule)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand .lockup{font-weight:700;letter-spacing:-.03em;font-size:24px;line-height:1}
.site-header .brand .lockup{color:var(--teal)}
.site-header.solid .brand .lockup{color:var(--black)}
.brand .name{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;border-left:1px solid currentColor;padding-left:14px;line-height:1.3}
.nav-links{display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav-links a{font-size:14px;font-weight:500;text-decoration:none;padding:8px 12px;opacity:.85}
.nav-links a:hover{opacity:1}
.nav-links a[aria-current="page"]{opacity:1;text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--teal);text-decoration-thickness:2px}
.nav-cta{margin-left:10px;padding:10px 18px;font-size:14px;opacity:1!important;text-decoration:none!important}

.theme-btn{margin-left:8px;width:38px;height:38px;border:1px solid currentColor;background:transparent;color:inherit;font-size:18px;line-height:1;cursor:pointer;opacity:.85}.theme-btn:hover{opacity:1}
.menu-btn{display:none;background:none;border:1px solid currentColor;color:inherit;padding:8px 14px;font:inherit;font-size:14px}
@media (max-width:960px){
  .nav-links{display:none;position:absolute;left:0;right:0;top:100%;background:var(--cream);color:var(--ink);box-shadow:0 1px 0 var(--rule);padding:12px var(--gutter) 22px;flex-direction:column;align-items:stretch}
  .nav-links.open{display:flex}.nav-links a{padding:12px 8px;font-size:17px}.nav-cta{margin:10px 0 0;justify-content:center}.menu-btn{display:inline-block}
}
.page{display:none}.page.active{display:block}
section{padding-block:clamp(56px,8vw,112px)}
section.tight{padding-top:clamp(40px,5vw,64px)}
.fade{height:40px;margin-top:-1px}
.f-cream-lteal{background:linear-gradient(var(--cream),var(--sec-lteal))}.f-lteal-white{background:linear-gradient(var(--sec-lteal),var(--sec-white))}.f-white-dteal{background:linear-gradient(var(--sec-white),var(--sec-dteal))}.f-dteal-cream{background:linear-gradient(var(--sec-dteal),var(--cream))}
.section-head{display:grid;gap:14px;max-width:820px;margin-bottom:clamp(28px,4vw,52px)}
.section-head.compact{margin-bottom:24px;max-width:900px}.section-head.compact h2{font-size:clamp(26px,3.2vw,40px)}.section-head.compact .lede{font-size:16px}
.section-head .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.page-hero{padding-block:clamp(120px,16vw,200px) clamp(28px,4vw,56px)}
.page-hero .wrap{display:grid;gap:18px;max-width:980px}
.page-hero h1{font-size:clamp(36px,5.6vw,76px);font-weight:700}
.on-cream{background:var(--cream)}
.on-lteal{background:var(--sec-lteal);padding-top:clamp(36px,4.5vw,64px);padding-bottom:clamp(40px,5vw,72px)}
.on-white{background:var(--sec-white);padding-top:clamp(40px,6vw,88px)}
.on-dteal{background:var(--sec-dteal);color:#fff;padding-top:clamp(40px,6vw,88px)}
.on-dteal .eyebrow{color:var(--teal)}
.on-dteal h2,.on-dteal h3{color:#fff}
.on-dteal .lede,.on-dteal p{color:rgba(255,255,255,.82)}
.on-dteal .meta{color:rgba(255,255,255,.6)}

/* ===== HERO ===== */
.hero{position:relative;height:min(100svh,55.3vw);min-height:560px;display:grid;align-items:end;padding-block:110px clamp(40px,4vw,56px);overflow:hidden;isolation:isolate;color:#fff;background:#1A1230}
.hero .art{position:absolute;inset:0;z-index:-3;background:var(--hero) center top/cover no-repeat}
.hero .scrim{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(6,4,30,.5) 0%,rgba(6,4,30,.24) 45%,rgba(6,4,30,.03) 100%),linear-gradient(180deg,rgba(6,4,30,.22) 0%,rgba(6,4,30,0) 30%,rgba(6,4,30,.3) 82%,rgba(6,4,30,.6) 100%)}
.hero .grid{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(9,225,205,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(9,225,205,.09) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.15))}
.hero .seam{position:absolute;left:0;right:0;bottom:0;height:28px;z-index:0;background:linear-gradient(180deg,transparent,var(--cream));opacity:.9;pointer-events:none}
.hero .wrap{display:grid;gap:12px;width:100%;position:relative;z-index:1}
.hero .tag{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:clamp(12px,1.2vw,15px);color:#fff;opacity:.9;max-width:40ch}
.hero .title{font-family:var(--display);font-weight:600;text-transform:uppercase;line-height:.92;letter-spacing:.005em;font-size:clamp(48px,8.2vw,118px);color:#fff;text-shadow:0 2px 24px rgba(6,4,30,.35)}
.hero .title small{display:block;font-size:.62em;font-weight:500;letter-spacing:.02em}
.hero .year{font-family:var(--display);font-weight:600;font-size:clamp(48px,6.4vw,92px);line-height:.9;color:var(--peach);letter-spacing:.01em}
.hero .date{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:clamp(14px,1.4vw,18px);color:#fff;display:flex;flex-wrap:wrap;gap:8px 24px}
.hero .date b{color:var(--teal);font-weight:500}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.hero .next{font-size:13px;color:rgba(255,255,255,.78);max-width:52ch}
@media (max-width:900px){.hero{height:auto;min-height:0;padding-top:120px}.hero .art{background-position:center}}@media (max-width:760px){.hero .year{display:none}}

/* thesis */
.thesis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:start}
.thesis h2{font-size:clamp(36px,5.4vw,72px)}
.thesis .cols{display:grid;gap:22px}
.thesis .cols p{color:var(--ink-2);font-size:17px;padding-top:14px;border-top:1px solid var(--peach)}
.thesis .cols strong{color:var(--ink);font-weight:600}
@media (max-width:860px){.thesis{grid-template-columns:1fr}}

/* frontier tiles: 3x2, 16:9, copy over the image on a bottom-up scrim */
.frontiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fr{position:relative;border:1px solid var(--rule);aspect-ratio:16/9;overflow:hidden;text-decoration:none;display:block;background:#0B0B22;color:#fff;isolation:isolate}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.fr:hover img,.fr:focus-visible img{transform:scale(1.04)}
.fr .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,0,15,.08) 0%,rgba(1,0,15,0) 30%,rgba(1,0,15,.45) 62%,rgba(1,0,15,.82) 100%)}
.fr .n{position:absolute;left:16px;top:12px;font-size:26px;color:#fff;text-shadow:0 1px 10px rgba(1,0,15,.6)}
.fr .cap{position:absolute;left:16px;right:16px;bottom:14px;display:grid;gap:4px}
.fr .cap h3{font-size:19px;color:#fff;letter-spacing:-.01em}
.fr .cap .meta{color:var(--teal);font-size:11px}
.fr .cap p{font-size:12.5px;color:rgba(255,255,255,.82);max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease}
.fr:hover .cap p,.fr:focus-visible .cap p{max-height:40px;opacity:1}
@media (hover:none){.fr .cap p{display:none}}
@media (max-width:900px){.frontiers{grid-template-columns:repeat(2,minmax(0,1fr))}.fr{aspect-ratio:4/3}.fr .cap h3{font-size:16px}}
@media (max-width:420px){.fr .cap h3{font-size:14px}.fr .n{font-size:20px}}
/* three days: ruled columns */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
.day{padding:26px 24px 26px 0;border-right:1px solid var(--rule);display:grid;gap:14px;align-content:start}
.day + .day{padding-left:24px}
.day:last-child{border-right:0;padding-right:0}
.day .d{font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#C9865E}
.day h3{font-size:22px}
.day ul{margin:0;padding:0;list-style:none;display:grid;gap:9px;color:var(--ink-2);font-size:15px}
.day li{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:start}
.day li time{font-family:var(--display);color:var(--dteal);font-size:14px;padding-top:1px}
.day li b{color:var(--ink);font-weight:600}
@media (max-width:900px){.days{grid-template-columns:1fr}.day{border-right:0;border-bottom:1px solid var(--rule);padding:22px 0}.day + .day{padding-left:0}}

/* who attends on dark teal */
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.w{border-top:1px solid var(--teal);padding-top:18px;display:grid;gap:10px}
.w h3{font-size:22px}
.w p{font-size:15px}
.w .meta{color:var(--teal)}
@media (max-width:860px){.who{grid-template-columns:1fr}}
.proof{margin-top:40px;padding-top:28px;border-top:1px solid rgba(255,255,255,.25);display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.proof .big{font-size:clamp(48px,5vw,72px);color:var(--teal)}
.proof p{font-size:15px;max-width:70ch}
@media (max-width:620px){.proof{grid-template-columns:1fr}}

/* partners: DTW-style cards */
.tiers{display:grid;gap:36px}
.tier .top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:14px}
.tier .top h3{font-family:var(--display);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--dteal);font-weight:500}
.logos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.logos.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pc{background:var(--card);border:1px solid var(--rule);display:grid;grid-template-rows:auto auto}
.pc .mark{aspect-ratio:16/9;display:grid;place-items:center;border-bottom:1px solid var(--rule);background:var(--card)}
.pc .mark span{font-weight:700;font-size:clamp(18px,2vw,26px);letter-spacing:-.02em;color:var(--ink)}
.pc .mark.b-jpm{background:#fff}.pc .mark.b-jpm span{color:#000;font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.01em}
.pc .mark.b-nvda{background:#000}.pc .mark.b-nvda span{color:#76B900;letter-spacing:.06em;text-transform:uppercase}
.pc .mark.b-goog{background:#fff;position:relative}.pc .mark.b-goog span{color:#202124}.pc .mark.b-goog::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 25% 50%,#FBBC05 50% 75%,#34A853 75%)}
.pc .mark.b-caruso{background:#fff}.pc .mark.b-caruso span.cv{color:#4C2799;font-family:var(--body);font-weight:800;letter-spacing:-.03em;text-transform:none;font-size:34px;line-height:1;display:grid;justify-items:center;gap:6px}.pc .mark.b-caruso span.cv small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#1B1464;display:flex;align-items:center;gap:8px}.pc .mark.b-caruso span.cv small::before,.pc .mark.b-caruso span.cv small::after{content:"";width:16px;height:1px;background:#1B1464}
.pc .mark span.soon{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.pc .body{padding:14px 16px 16px;display:grid;gap:6px}
.pc .body b{font-weight:600;font-size:15px}
@media (max-width:860px){.logos,.logos.three{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* closing scene */
.close{position:relative;color:#fff;padding-block:clamp(120px,16vw,200px) clamp(96px,14vw,180px);overflow:hidden;isolation:isolate;background:#0B0A2A}
.close .art{position:absolute;inset:0;z-index:-2;background:var(--close) center 60%/cover no-repeat}
.close .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,4,30,.35),rgba(6,4,30,.15) 50%,rgba(6,4,30,.7)),linear-gradient(90deg,rgba(6,4,30,.4),rgba(6,4,30,0) 60%)}
.close .seam{position:absolute;left:0;right:0;top:0;height:40px;z-index:0;background:linear-gradient(180deg,var(--cream),transparent);pointer-events:none}
.close .wrap{display:grid;gap:20px;max-width:900px;position:relative;z-index:1}
.close h2{color:#fff;font-size:clamp(34px,5.2vw,68px)}
.close p{color:rgba(255,255,255,.85);font-size:17px;max-width:52ch}
.close .count{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--peach);display:flex;gap:14px;align-items:baseline}
.close .count .t{font-size:clamp(40px,5vw,64px);letter-spacing:.02em;line-height:.9;color:#fff;font-weight:600}
.close .actions{display:flex;flex-wrap:wrap;gap:12px}

/* footer: black */
footer{background:var(--black);color:#fff;padding-block:56px 40px;font-size:14px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
footer h4{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
footer ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
footer a{text-decoration:none;color:#fff}
footer a:hover{color:var(--teal)}
footer .small{color:rgba(255,255,255,.65)}
.wordmark{font-weight:700;letter-spacing:-.03em;font-size:30px;color:var(--teal);line-height:1}
.news{display:flex;gap:0;margin-top:10px;max-width:360px}
.news input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:10px 14px;font:inherit}
.news input::placeholder{color:rgba(255,255,255,.5)}

/* inner components */
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.seg{background:var(--card);border:1px solid var(--rule);padding:28px 26px;display:grid;gap:14px;grid-template-rows:auto 1fr auto auto;align-content:stretch}.seg ul{align-content:start}.seg .btn{justify-self:start}
.seg h3{font-size:24px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.seg ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:15px;display:grid;gap:6px}
.seg .price{font-size:38px;color:var(--dteal)}
.seg .price small{font-family:var(--body);font-size:13px;color:var(--ink-3);margin-left:8px;font-weight:400;letter-spacing:0}
.seg .btn{justify-self:start}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.person{background:var(--card);border:1px solid var(--rule);display:grid;grid-template-rows:auto auto}
.person .ph{aspect-ratio:1;background:linear-gradient(135deg,var(--ph1),var(--ph2));display:grid;place-items:center;color:var(--ink-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
.person .body{padding:12px 14px 14px;display:grid;gap:6px}
.person .role{font-weight:600;font-size:15px}.person .org{font-size:13px;color:var(--ink-2)}
.frs{display:grid}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start;padding:26px 0;border-top:1px solid var(--rule)}
.frow:last-child{border-bottom:1px solid var(--rule)}
.frow .pic{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--rule);position:relative}
.frow .pic img{width:100%;height:100%;object-fit:cover;display:block}
.frow .pic .n{position:absolute;left:14px;top:10px;font-size:26px;color:#fff;text-shadow:0 1px 10px rgba(1,0,15,.5)}
.frow h3{font-size:24px;margin-bottom:8px}
.frow p{color:var(--ink-2);font-size:15px}
.frow .info{font-size:14px;color:var(--ink-2);display:grid;gap:8px}
.frow .info b{color:var(--ink);font-weight:600}
@media (max-width:860px){.frow{grid-template-columns:1fr}}
.formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.format{border-top:1px solid var(--dteal);padding-top:16px;display:grid;gap:8px}
.format h3{font-size:19px}.format p{color:var(--ink-2);font-size:15px}
.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.benefit{display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:14px}.benefit .n{font-family:var(--display);color:#C9865E;font-size:32px;line-height:.9}.benefit p{color:var(--ink-2);font-size:15px}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.gcard{border:1px solid var(--rule);padding:26px 24px;display:grid;gap:12px;align-content:start;background:var(--card)}
.gcard h3{font-size:20px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.gcard ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--ink-2);font-size:15px}
.gcard li b{color:var(--ink);font-weight:600}
.gcard .fact{font-family:var(--display);color:var(--dteal);font-size:36px;line-height:.9;font-weight:600}
.note{border:1px dashed var(--dteal);padding:10px 14px;font-size:13px;color:var(--dteal);background:var(--card);display:inline-block}
.band{background:var(--teal);color:var(--black)}
.band .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:center}
.band p{color:rgba(1,0,15,.78);font-size:17px}
.band .btn-dark{background:var(--black);color:#fff;justify-self:start}
@media (max-width:760px){.band .wrap{grid-template-columns:1fr}}
:root[data-theme="dark"] .site-header.solid .brand .lockup,:root[data-theme="dark"] .day .d,:root[data-theme="dark"] .benefit .n{color:var(--teal)}

:root[data-theme="dark"] :root[data-theme="dark"]

.pc{min-width:0}.pc .mark span{text-align:center;overflow-wrap:anywhere;padding:0 8px}

/* LOGOS-OCT6: real sponsor marks */

/* HERO-CENTER-OCT6 (V1 only; V2 uses .hero.v2) */

/* COPYFIX-OCT6: symmetric role columns, aligned section heads */

/* GATHER-OCT6: Boulder page as "Where we'll gather" */
.gather-hero .wrap{max-width:var(--max)}

.bld-dlg ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.bld-when li{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--rule);padding-top:7px}
.bld-when time{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dteal);padding-top:2px}
.bld-who li,.bld-facts li{font-size:14px;color:var(--ink-2)}
.bld-who li b{color:var(--ink)}
.bld-dlg-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.bld-x{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border:0;background:rgba(1,0,15,.72);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.t4-room,.vlink{display:inline-block;font-family:var(--display);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dteal);text-decoration:none;margin:2px 0 14px}
.vlink{margin:12px 0 0}
.t4-room:hover,.vlink:hover{text-decoration:underline}
:root[data-theme="dark"] .bld-k,:root[data-theme="dark"] .bld-meta .go,:root[data-theme="dark"] .bld-when time,:root[data-theme="dark"] .t4-room,:root[data-theme="dark"] .vlink{color:var(--teal)}
:root[data-theme="dark"] .bld-seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#01000F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bld-k,:root:not([data-theme="light"]) .bld-meta .go,:root:not([data-theme="light"]) .bld-when time,:root:not([data-theme="light"]) .t4-room,:root:not([data-theme="light"]) .vlink{color:var(--teal)}:root:not([data-theme="light"]) .bld-seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#01000F}}
@media (max-width:980px){.bld-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bld-dlg-in{grid-template-columns:minmax(0,1fr)}.bld-dlg figure img{min-height:0;aspect-ratio:16/9}}
@media (max-width:620px){.bld-grid{grid-template-columns:minmax(0,1fr)}.bld-when li{grid-template-columns:92px 1fr}.bld-dlg-body{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){.bld-card{transition:none}}

.t4-perks li.t4-roomli{padding-left:0}.t4-perks li.t4-roomli::before{content:none}.t4-perks .t4-room{margin:4px 0 0}
.vtext .vlink{display:block;width:fit-content}

/* ---- Teaser site overrides (Oct 2026) ---- */
body{background:#01000F}
.site-header .wrap.nav{display:flex;align-items:center;justify-content:space-between;min-height:76px}
.hero:not(.v2){min-height:100svh}
@media (max-width:900px){.hero:not(.v2){min-height:100svh}}
.hero .seam{display:none}
.soon{min-height:100svh;display:grid;place-items:center;text-align:center;background:#0B0A10;color:#fff;position:relative;isolation:isolate;padding-block:120px 64px;overflow:hidden}
.soon::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(9,225,205,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(9,225,205,.07) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 30% 20%,#000 0%,transparent 70%)}
.soon .wrap{display:grid;gap:22px;justify-items:center}
.soon .status{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;font-size:14px;color:rgba(255,255,255,.7);display:inline-flex;align-items:center;gap:12px}
.soon .status i{width:9px;height:9px;border-radius:50%;background:var(--peach);box-shadow:0 0 12px rgba(244,182,147,.7)}
@media (prefers-reduced-motion:no-preference){.soon .status i{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}
.soon h1{font-family:var(--body);font-weight:700;font-size:clamp(40px,7vw,96px);letter-spacing:-.03em;line-height:1.02;color:#fff}
.soon h1 em{font-style:italic;color:var(--peach)}
.soon .sub{font-size:clamp(17px,1.6vw,21px);color:rgba(255,255,255,.66);max-width:46ch;line-height:1.55}
.soon .when{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;font-size:clamp(13px,1.3vw,16px);color:var(--teal)}
.soon .contact{font-size:14px;color:rgba(255,255,255,.6)}
.soon .contact a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.soon .back{margin-top:8px}

.site-header .brand .name{font-size:13px;letter-spacing:.16em;line-height:1.35;padding-left:22px;opacity:.92;border-left-color:rgba(255,255,255,.75)}
